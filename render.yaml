services:
  - type: web
    name: uniphishguard-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: REQUIRE_AUTH
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENTRA_TENANT_ID
        sync: false
      - key: ENTRA_CLIENT_ID
        sync: false
      - key: TRUSTED_AUTHSERV_IDS
        sync: false
      - key: HISTORY_HMAC_SECRET
        generateValue: true
