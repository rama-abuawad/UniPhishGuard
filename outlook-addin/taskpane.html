<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UniPhishGuard</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="./office-bootstrap.js?v=1.0.16"></script>
  <link rel="stylesheet" href="./taskpane.css">
</head>
<body>
  <main class="shell">
    <header class="header">
      <div>
        <p class="eyebrow">UniPhishGuard</p>
        <h1>Email Risk Scan</h1>
      </div>
      <span id="connectionStatus" class="status">Ready</span>
    </header>

    <div class="actions">
      <button id="scanButton" class="primary-button" type="button">Scan Email</button>
      <button id="historyButton" class="secondary-button" type="button">History</button>
    </div>

    <section id="result" class="result" aria-live="polite">
      <p class="empty">Open an email and scan it with UniPhishGuard.</p>
    </section>

    <p id="runtimeNote" class="runtime-note" hidden></p>
  </main>
  <script src="./config.js?v=1.0.16"></script>
  <script src="./taskpane-utils.js?v=1.0.16"></script>
  <script src="./taskpane.js?v=1.0.16"></script>
</body>
</html>
