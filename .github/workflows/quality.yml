name: Quality gate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: outlook-addin/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Check Python syntax
        run: python -m compileall -q backend/app backend/tests backend/train_model.py backend/evaluate_external.py
      - name: Run backend tests and integrity checks
        working-directory: backend
        run: python -m pytest -q
      - name: Install frontend dependencies
        working-directory: outlook-addin
        run: npm ci
      - name: Run frontend tests
        working-directory: outlook-addin
        run: npm test
      - name: Check frontend JavaScript syntax
        working-directory: outlook-addin
        run: node --check taskpane.js && node --check taskpane-utils.js && node --check office-bootstrap.js && node --check configure-production.js
      - name: Validate Outlook manifest
        working-directory: outlook-addin
        run: npm run validate
      - name: Validate generated production manifest and SSO metadata
        working-directory: outlook-addin
        run: |
          npm run configure:production -- --app-url https://addin.campus.edu --api-url https://api.campus.edu --client-id ffffffff-ffff-ffff-ffff-ffffffffffff
          npx office-addin-manifest validate dist/manifest.xml
          if (-not (Test-Path dist/addin/taskpane.html)) { throw "Production task pane was not generated." }
          if (-not (Test-Path dist/addin/config.js)) { throw "Production API configuration was not generated." }
